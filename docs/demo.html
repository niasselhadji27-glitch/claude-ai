/* ============================== state ============================== */

let S;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      S = JSON.parse(raw);
      // finish any render that was mid-flight when the page was closed
      S.renders.forEach(r => { if (r.status === "rendering") { r.status = "completed"; r.progress = 100; } });
      S.jobs.forEach(j => { if (j.status === "processing") { j.status = "failed"; j.error = "Interrupted — try again"; } });
      return;
    }
  } catch (e) { /* fall through to seed */ }
  S = JSON.parse(JSON.stringify(SEED));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage may be unavailable */ } }
load();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, err) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

function spend(n, what) {
  if (S.credits < n) {
    toast(`Not enough credits for this ${what} (${n} needed). Upgrade in Settings.`, true);
    return false;
  }
  S.credits -= n;
  save();
  const c = $("#creditnum"); if (c) c.textContent = S.credits;
  return true;
}

    setTimeout(() => {

    const btn = $("#gen");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Writing…';

  return `<div class="card variation"><div class="pad">

    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <button class="btn sm ghost" data-save="${s.id}" disabled>Save changes</button></div>
  </div></div>`;
}

function wireVariations(ad) {
  document.querySelectorAll("[data-edit]").forEach(t => {
    t.addEventListener("input", () => {
      const b = document.querySelector(`[data-save="${t.dataset.edit}"]`);
      if (b) b.disabled = false;
    });
  });
  document.querySelectorAll("[data-save]").forEach(b => {
    b.addEventListener("click", () => {
      const s = S.scripts.find(x => x.id === b.dataset.save);
      const t = document.querySelector(`[data-edit="${b.dataset.save}"]`);
      if (s && t) { s.content = t.value; s.edited = true; save(); b.disabled = true; toast("Script saved"); }
    });
  });
  document.querySelectorAll("[data-render]").forEach(b => {
    b.addEventListener("click", () => { location.hash = "#/renders/new?" + b.dataset.render; });
  });
}

        <p class="desc">Reset the demo to its original seed data.</p>
        <button class="btn outline" id="reset">Reset demo data</button></div></div>
    </div>`);

  document.querySelectorAll("[data-plan]").forEach(b =>
    b.addEventListener("click", () => {
      S.tier = b.dataset.plan;
      S.credits += Number(b.dataset.cr);
      save(); renderSettings();
      toast(`In production this opens Stripe Checkout — demo upgraded you to ${b.dataset.plan} and granted ${b.dataset.cr} credits`);
    }));
  $("#reset").addEventListener("click", () => {
    const email = S.email;
    S = JSON.parse(JSON.stringify(SEED)); S.email = email; save(); renderSettings();
    toast("Demo data reset");
  });
}

/* ============================== boot ============================== */
window.addEventListener("hashchange", route);
route();
</script>
