<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meta Ads Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Meta Ads Studio</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="dashboard" role="tab">Dashboard</button>
      <button class="tab" data-tab="creative" role="tab">Creative Studio</button>
      <button class="tab" data-tab="trending" role="tab">Trending Ads</button>
    </nav>
    <div id="status-badges" class="badges"></div>
  </header>

  <!-- ============ DASHBOARD ============ -->
  <main id="tab-dashboard" class="panel active">
    <div class="filter-row">
      <label for="range">Date range</label>
      <select id="range">
        <option value="last_7d">Last 7 days</option>
        <option value="last_14d">Last 14 days</option>
        <option value="last_30d" selected>Last 30 days</option>
        <option value="last_90d">Last 90 days</option>
      </select>
      <span id="demo-note" class="muted"></span>
    </div>

    <section class="tiles" id="stat-tiles"></section>

    <section class="chart-grid">
      <div class="card">
        <h2>Daily spend</h2>
        <div class="chart" id="chart-spend"></div>
      </div>
      <div class="card">
        <h2>CTR trend <span class="unit">%</span></h2>
        <div class="chart" id="chart-ctr"></div>
      </div>
      <div class="card wide">
        <h2>ROAS by campaign</h2>
        <div class="chart" id="chart-roas"></div>
      </div>
      <div class="card wide">
        <h2>Campaigns</h2>
        <div class="table-scroll">
          <table id="campaign-table">
            <thead>
              <tr><th>Campaign</th><th>Spend</th><th>Impressions</th><th>Clicks</th><th>CTR</th><th>CPM</th><th>ROAS</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ CREATIVE STUDIO ============ -->
  <main id="tab-creative" class="panel">
    <div class="two-col">
      <div class="card">
        <h2>Brief</h2>
        <form id="creative-form">
          <label>Product / service *
            <textarea id="cf-product" rows="3" required
              placeholder="e.g. Organic cold-brew coffee concentrate, makes 20 cups per bottle"></textarea>
          </label>
          <label>Target audience
            <input id="cf-audience" placeholder="e.g. busy professionals 25-40 who skip breakfast" />
          </label>
          <label>Tone
            <input id="cf-tone" placeholder="e.g. playful, premium, direct" />
          </label>
          <label>Offer / promo
            <input id="cf-offer" placeholder="e.g. 20% off first order" />
          </label>
          <button type="submit" class="primary" id="cf-submit">Generate ad copy + prompts</button>
        </form>
        <p class="muted small">Copy is generated by Claude. Image and video prompts feed the generators on the right.</p>
      </div>

      <div class="card">
        <h2>Generate media</h2>
        <label>Image prompt
          <textarea id="img-prompt" rows="4" placeholder="Auto-filled from the brief, or write your own"></textarea>
        </label>
        <div class="row">
          <select id="img-aspect">
            <option value="1:1">1:1 (feed)</option>
            <option value="4:5">4:5 (feed portrait)</option>
            <option value="9:16">9:16 (story/reel)</option>
            <option value="16:9">16:9 (landscape)</option>
          </select>
          <button class="primary" id="btn-image">Generate image</button>
        </div>
        <div id="image-result" class="media-result"></div>

        <hr />
        <label>Video prompt
          <textarea id="vid-prompt" rows="4" placeholder="Auto-filled from the brief, or write your own"></textarea>
        </label>
        <button class="primary" id="btn-video">Generate video</button>
        <p class="muted small">Video generation can take a few minutes.</p>
        <div id="video-result" class="media-result"></div>
      </div>
    </div>

    <section id="copy-results"></section>
  </main>

  <!-- ============ TRENDING ============ -->
  <main id="tab-trending" class="panel">
    <div class="filter-row">
      <input id="trend-query" placeholder="Search a niche, brand, or keyword — e.g. skincare" />
      <select id="trend-country">
        <option value="US" selected>United States</option>
        <option value="GB">United Kingdom</option>
        <option value="DE">Germany</option>
        <option value="FR">France</option>
        <option value="CA">Canada</option>
        <option value="AU">Australia</option>
      </select>
      <button class="primary" id="btn-trend">Search</button>
      <span id="trend-note" class="muted"></span>
    </div>
    <section id="trending-grid" class="ad-grid"></section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
