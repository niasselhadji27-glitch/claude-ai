<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks — Sample App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>My Tasks</h1>
      <p class="subtitle" id="date-label"></p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        aria-label="New task"
        maxlength="200"
        required
      />
      <button type="submit" aria-label="Add task">Add</button>
    </form>

    <div class="filters" role="tablist" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <p id="empty-state" class="empty-state">No tasks yet — add one above! ✨</p>

    <footer class="app-footer">
      <span id="task-count">0 tasks</span>
      <button id="clear-completed" class="link-btn">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
